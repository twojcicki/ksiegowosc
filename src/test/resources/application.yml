spring:
  datasource:
    url: jdbc:h2:mem:ksiegowosc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

vaadin:
  launch-browser: false

app:
  encryption:
    # Fixed 32-byte key for tests only (Base64 of ASCII "0123456789abcdef0123456789abcdef")
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

clients:
  merit:
    base-url: https://example.test/api/v1
    v2-base-url: https://example.test/api/v2
  allegro:
    redirect-uri: http://localhost:8080/api/allegro/auth/callback
    scopes: allegro:api:sale:offers:read allegro:api:orders:read
