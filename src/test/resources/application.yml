spring:
  datasource:
    url: jdbc:h2:mem:ksiegowosc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

vaadin:
  launch-browser: false

clients:
  merit:
    base-url: https://example.test/api/v1
    api-id: test-id
    api-key: test-key
    v2-base-url: https://example.test/api/v2
  allegro:
    api-base-url: https://api.allegro.test
    auth-url: https://allegro.test
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/api/allegro/auth/callback
    scopes: allegro:api:sale:offers:read allegro:api:orders:read
