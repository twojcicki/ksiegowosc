databaseChangeLog:
  - changeSet:
      id: 006-user-api-credentials
      author: ksiegowosc
      changes:
        - createTable:
            tableName: user_api_credentials
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_user_api_credentials_user
                    references: app_user(id)
              - column:
                  name: merit_api_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: merit_api_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: allegro_client_id
                  type: VARCHAR(200)
                  constraints:
                    nullable: true
              - column:
                  name: allegro_client_secret
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

  - changeSet:
      id: 006-allegro-token-per-user
      author: ksiegowosc
      changes:
        - delete:
            tableName: allegro_token
        - dropTable:
            tableName: allegro_token
        - createTable:
            tableName: allegro_token
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
                    foreignKeyName: fk_allegro_token_user
                    references: app_user(id)
              - column:
                  name: access_token
                  type: VARCHAR(8192)
                  constraints:
                    nullable: false
              - column:
                  name: refresh_token
                  type: VARCHAR(8192)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
