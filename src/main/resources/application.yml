spring:
  application:
    name: ksiegowosc
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ksiegowosc}
    username: ${SPRING_DATASOURCE_USERNAME:ksiegowosc}
    password: ${SPRING_DATASOURCE_PASSWORD:ksiegowosc}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

vaadin:
  launch-browser: false
  exclude-urls: /api/**,/swagger-ui/**,/v3/api-docs/**

clients:
  merit:
    base-url: https://program.360ksiegowosc.pl/api/v1
    v2-base-url: https://program.360ksiegowosc.pl/api/v2
  allegro:
    api-base-url: https://api.allegro.pl.allegrosandbox.pl
    auth-url: https://allegro.pl.allegrosandbox.pl
    # Empty = auto from request host (e.g. https://…onrender.com/api/allegro/auth/callback)
    redirect-uri: ${ALLEGRO_REDIRECT_URI:}
    scopes: allegro:api:sale:offers:read allegro:api:orders:read
